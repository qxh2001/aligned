<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C6BB0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B8DC8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8E2F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C5BAE0;stop-opacity:0.6" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A3D7A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Subtle inner highlight -->
  <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Three horizontal alignment lines — staggered to suggest "aligning" -->
  <!-- Top line - short, left-anchored -->
  <rect x="108" y="168" width="160" height="20" rx="10" fill="url(#lineGrad)" opacity="0.7"/>

  <!-- Middle line - full width, bold, centered -->
  <rect x="108" y="246" width="296" height="24" rx="12" fill="#FFFFFF" filter="url(#softShadow)"/>

  <!-- Bottom line - medium, right-anchored -->
  <rect x="244" y="328" width="160" height="20" rx="10" fill="url(#lineGrad)" opacity="0.7"/>

  <!-- Small circle accent on the left of the middle line — like a bullet/node -->
  <circle cx="88" cy="258" r="14" fill="#C5BAE0" opacity="0.9"/>
  <circle cx="88" cy="258" r="8" fill="#FFFFFF"/>
</svg>
